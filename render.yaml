# ── Kasa Health v8 — Render Blueprint ─────────────────────────────────────────
# New → Blueprint → pick this repo. Render will ask for every `sync: false` value.
services:

  - type: web
    name: kasa-health-backend
    runtime: python
    plan: starter                       # disks need a paid plan
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py app.main:app
    healthCheckPath: /health
    disk:                               # keeps the database + correction audio across deploys
      name: kasa-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: WEB_CONCURRENCY
        value: "2"
      # LLM: Grok (xAI) is primary. Groq is an optional fallback.
      - key: XAI_API_KEY
        sync: false
      - key: XAI_MODEL
        value: grok-4.20-0309-non-reasoning
      - key: XAI_FALLBACK_MODEL
        value: grok-4.3
      - key: GROQ_API_KEY
        sync: false                     # optional — leave blank to skip
      - key: GEMINI_API_KEY
        sync: false                     # optional
      - key: OPENAI_API_KEY
        sync: false                     # optional
      - key: QWEN_API_KEY
        sync: false                     # optional
      - key: LLM_ORDER
        value: grok,gemini,openai,qwen,grok-fallback,groq
      # Alert emails (errors + safety reports) — set ONE of RESEND_API_KEY or SMTP_*
      - key: ALERT_EMAIL_TO
        value: akwasi@khaya.ai
      - key: ALERT_EMAIL_FROM
        sync: false                     # e.g. Kasa Health <alerts@yourdomain.com>
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      # Khaya (GhanaNLP)
      - key: KHAYA_ASR_KEY
        sync: false
      - key: KHAYA_TTS_KEY
        sync: false
      - key: KHAYA_TRANSLATE_KEY
        sync: false
      # Hugging Face (thumbs-down audio corrections)
      - key: HF_TOKEN
        sync: false
      # Security: generated by Render. The frontend copies the same value below.
      - key: INTERNAL_API_TOKEN
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true             # find it in the dashboard; needed for exports
      - key: CORS_ORIGINS
        value: https://kasa-health-frontend.onrender.com

  - type: web
    name: kasa-health-frontend
    runtime: python
    plan: starter
    rootDir: frontend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: GUNICORN_THREADS
        value: "32"
      - key: PROXY_COUNT
        value: "1"
      # Talk to the backend over Render's private network (faster, not public).
      - key: FASTAPI_HOSTPORT
        fromService:
          type: web
          name: kasa-health-backend
          property: hostport
      - key: INTERNAL_API_TOKEN
        fromService:
          type: web
          name: kasa-health-backend
          envVarKey: INTERNAL_API_TOKEN
