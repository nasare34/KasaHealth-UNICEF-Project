# Local / self-hosted deployment:  docker compose up --build
# Reads secrets from .env in this folder (copy .env.example to .env first).
services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      - DATA_DIR=/data
      - ENVIRONMENT=production
      - CORS_ORIGINS=http://localhost:5000
    volumes:
      - kasa-data:/data            # database + correction audio survive restarts
    restart: unless-stopped
    # Not published to the host: only the frontend talks to it.

  frontend:
    build: ./frontend
    env_file: .env
    environment:
      - FASTAPI_URL=http://backend:8000
      - PROXY_COUNT=0              # set to 1 if you put a reverse proxy (nginx, Caddy) in front
    ports:
      - "5000:5000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kasa-data:
